---
- name: Lab 12 - Extending Kubernetes
  hosts: all
  become: true

  vars:
    kube_version_repo: "v1.30"
    pod_network_cidr: "192.168.0.0/16"
    kube_apiserver_ip: "192.168.56.10"

    operator_dir: "/home/vagrant/namespace-operator"
    operator_image: "namespace-operator:latest"
    operator_deployment: "namespace-operator"
    operator_namespace: "kube-system"

    test_namespace: "team-alpha"

  tasks:
    - name: Wait for cloud-init
      shell: cloud-init status --wait || true
      changed_when: false

    - name: Install ca-certificates
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - apt-transport-https
        state: present
        update_cache: true

    - name: Disable swap if enabled
      shell: swapoff -a
      changed_when: false

    - name: Permanently disable swap
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Install system dependencies
      apt:
        name:
          - containerd
          - docker.io
          - conntrack
          - socat
          - ebtables
          - ethtool
          - iproute2
          - iptables
          - python3
          - python3-pip
        state: present
        update_cache: true

    - name: Enable docker
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Enable containerd
      systemd:
        name: containerd
        enabled: true
        state: started

    - name: Create containerd config directory
      file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: Generate default containerd config
      shell: containerd config default > /etc/containerd/config.toml
      changed_when: true

    - name: Enable SystemdCgroup for containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Restart containerd after config change
      systemd:
        name: containerd
        state: restarted
        enabled: true

    - name: Load br_netfilter
      modprobe:
        name: br_netfilter
        state: present

    - name: Load overlay
      modprobe:
        name: overlay
        state: present

    - name: Persist Kubernetes kernel modules
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Configure sysctl for Kubernetes
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Apply sysctl now
      shell: sysctl --system
      changed_when: false

    - name: Force Google DNS
      copy:
        dest: /etc/systemd/resolved.conf
        content: |
          [Resolve]
          DNS=8.8.8.8 1.1.1.1
          FallbackDNS=8.8.4.4

    - name: Restart systemd-resolved
      systemd:
        name: systemd-resolved
        state: restarted
        enabled: true

    - name: Make keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Kubernetes GPG key
      shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ kube_version_repo }}/deb/Release.key \
          | gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes apt repository
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ kube_version_repo }}/deb/ /

    - name: Update apt cache after adding Kubernetes repo
      apt:
        update_cache: true

    - name: Install kubeadm, kubelet, kubectl
      apt:
        name:
          - kubeadm
          - kubelet
          - kubectl
        state: present

    - name: Hold Kubernetes packages
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubeadm
        - kubelet
        - kubectl

    - name: Pre-pull kubeadm images
      shell: kubeadm config images pull --cri-socket unix:///run/containerd/containerd.sock
      changed_when: false

    - name: Initialize Kubernetes cluster with kubeadm
      shell: |
        kubeadm init \
          --apiserver-advertise-address={{ kube_apiserver_ip }} \
          --pod-network-cidr={{ pod_network_cidr }} \
          --cri-socket unix:///run/containerd/containerd.sock
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Create .kube directory for root
      file:
        path: /root/.kube
        state: directory
        mode: "0700"

    - name: Copy admin.conf to root kubeconfig
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: true
        mode: "0600"

    - name: Create .kube directory for vagrant
      file:
        path: /home/vagrant/.kube
        state: directory
        owner: vagrant
        group: vagrant
        mode: "0755"

    - name: Copy admin.conf to vagrant kubeconfig
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/vagrant/.kube/config
        remote_src: true
        owner: vagrant
        group: vagrant
        mode: "0600"

    - name: Remove control-plane taint
      shell: |
        kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true
        kubectl taint nodes --all node-role.kubernetes.io/master- || true
      changed_when: false

    - name: Install Calico CNI
      shell: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.2/manifests/calico.yaml
      changed_when: false

    - name: Wait for node ready
      shell: kubectl wait --for=condition=Ready nodes --all --timeout=240s
      changed_when: false

    - name: Create operator build directory
      file:
        path: "{{ operator_dir }}"
        state: directory
        owner: vagrant
        group: vagrant
        mode: "0755"

    - name: Write operator requirements.txt
      copy:
        dest: "{{ operator_dir }}/requirements.txt"
        owner: vagrant
        group: vagrant
        mode: "0644"
        content: |
          kopf==1.37.4
          kubernetes==29.0.0

    - name: Write operator.py
      copy:
        dest: "{{ operator_dir }}/operator.py"
        owner: vagrant
        group: vagrant
        mode: "0644"
        content: |
          import kopf
          import kubernetes
          from kubernetes import client, config
          from kubernetes.client.rest import ApiException


          SYSTEM_NAMESPACES = {
              "default",
              "kube-system",
              "kube-public",
              "kube-node-lease",
          }


          def load_config():
              try:
                  config.load_incluster_config()
              except Exception:
                  config.load_kube_config()


          load_config()

          core = client.CoreV1Api()
          rbac = client.RbacAuthorizationV1Api()


          @kopf.on.startup()
          def configure(settings: kopf.OperatorSettings, **kwargs):
              settings.persistence.finalizer = None
              settings.posting.enabled = True


          def create_or_patch_role(namespace: str, role_name: str, rules: list, logger):
              role = client.V1Role(
                  metadata=client.V1ObjectMeta(
                      name=role_name,
                      namespace=namespace,
                      labels={
                          "app.kubernetes.io/managed-by": "namespace-operator",
                          "lab": "lab12",
                      },
                  ),
                  rules=rules,
              )

              try:
                  rbac.create_namespaced_role(namespace=namespace, body=role)
                  logger.info(f"Created Role {role_name} in namespace {namespace}")
              except ApiException as e:
                  if e.status == 409:
                      rbac.patch_namespaced_role(
                          name=role_name,
                          namespace=namespace,
                          body=role,
                      )
                      logger.info(f"Patched existing Role {role_name} in namespace {namespace}")
                  else:
                      raise


          def create_or_patch_rolebinding(
              namespace: str,
              rolebinding_name: str,
              role_name: str,
              group_name: str,
              logger,
          ):
              rolebinding = client.V1RoleBinding(
                  metadata=client.V1ObjectMeta(
                      name=rolebinding_name,
                      namespace=namespace,
                      labels={
                          "app.kubernetes.io/managed-by": "namespace-operator",
                          "lab": "lab12",
                      },
                  ),
                  subjects=[
                      client.V1Subject(
                          kind="Group",
                          name=group_name,
                          api_group="rbac.authorization.k8s.io",
                      )
                  ],
                  role_ref=client.V1RoleRef(
                      kind="Role",
                      name=role_name,
                      api_group="rbac.authorization.k8s.io",
                  ),
              )

              try:
                  rbac.create_namespaced_role_binding(
                      namespace=namespace,
                      body=rolebinding,
                  )
                  logger.info(f"Created RoleBinding {rolebinding_name} in namespace {namespace}")
              except ApiException as e:
                  if e.status == 409:
                      rbac.patch_namespaced_role_binding(
                          name=rolebinding_name,
                          namespace=namespace,
                          body=rolebinding,
                      )
                      logger.info(f"Patched existing RoleBinding {rolebinding_name} in namespace {namespace}")
                  else:
                      raise


          def ensure_namespace_rbac(namespace: str, logger):
              if namespace in SYSTEM_NAMESPACES:
                  logger.info(f"Skipping system namespace {namespace}")
                  return

              view_rules = [
                  client.V1PolicyRule(
                      api_groups=["", "apps", "batch"],
                      resources=[
                          "pods",
                          "pods/log",
                          "services",
                          "configmaps",
                          "deployments",
                          "replicasets",
                          "statefulsets",
                          "daemonsets",
                          "jobs",
                          "cronjobs",
                      ],
                      verbs=["get", "list", "watch"],
                  )
              ]

              edit_rules = [
                  client.V1PolicyRule(
                      api_groups=["", "apps", "batch"],
                      resources=[
                          "pods",
                          "pods/log",
                          "services",
                          "configmaps",
                          "deployments",
                          "replicasets",
                          "statefulsets",
                          "daemonsets",
                          "jobs",
                          "cronjobs",
                      ],
                      verbs=[
                          "get",
                          "list",
                          "watch",
                          "create",
                          "update",
                          "patch",
                          "delete",
                      ],
                  )
              ]

              admin_rules = [
                  client.V1PolicyRule(
                      api_groups=["*"],
                      resources=["*"],
                      verbs=["*"],
                  )
              ]

              create_or_patch_role(namespace, "namespace-view", view_rules, logger)
              create_or_patch_role(namespace, "namespace-edit", edit_rules, logger)
              create_or_patch_role(namespace, "namespace-admin", admin_rules, logger)

              create_or_patch_rolebinding(
                  namespace=namespace,
                  rolebinding_name=f"{namespace}-viewers",
                  role_name="namespace-view",
                  group_name=f"{namespace}:viewers",
                  logger=logger,
              )

              create_or_patch_rolebinding(
                  namespace=namespace,
                  rolebinding_name=f"{namespace}-editors",
                  role_name="namespace-edit",
                  group_name=f"{namespace}:editors",
                  logger=logger,
              )

              create_or_patch_rolebinding(
                  namespace=namespace,
                  rolebinding_name=f"{namespace}-admins",
                  role_name="namespace-admin",
                  group_name=f"{namespace}:admins",
                  logger=logger,
              )


          @kopf.on.create("", "v1", "namespaces")
          def on_namespace_create(name, logger, **kwargs):
              logger.info(f"Namespace created: {name}")
              ensure_namespace_rbac(name, logger)


          @kopf.on.resume("", "v1", "namespaces")
          def on_namespace_resume(name, logger, **kwargs):
              logger.info(f"Namespace resumed: {name}")
              ensure_namespace_rbac(name, logger)


          def container_missing_resources(container: dict) -> bool:
              resources = container.get("resources") or {}
              requests = resources.get("requests") or {}
              limits = resources.get("limits") or {}

              has_requests = bool(requests.get("cpu")) and bool(requests.get("memory"))
              has_limits = bool(limits.get("cpu")) and bool(limits.get("memory"))

              return not (has_requests and has_limits)


          def validate_pod_resources(name: str, namespace: str, body: dict, logger):
              if namespace in SYSTEM_NAMESPACES:
                  return

              spec = body.get("spec") or {}
              containers = spec.get("containers") or []

              if not containers:
                  return

              missing = [
                  container.get("name", "unknown")
                  for container in containers
                  if container_missing_resources(container)
              ]

              if not missing:
                  return

              message = "Missing CPU/memory requests or limits for containers: " + ", ".join(missing)

              core.patch_namespaced_pod(
                  name=name,
                  namespace=namespace,
                  body={
                      "metadata": {
                          "annotations": {
                              "operator/resource-warning": message
                          }
                      }
                  },
              )

              logger.info(f"Annotated Pod {namespace}/{name}: {message}")


          def debug_enabled(annotations: dict) -> bool:
              value = str((annotations or {}).get("debug", "")).lower()
              return value in ["true", "yes", "1", "enabled"]


          def find_container_port(body: dict) -> int:
              spec = body.get("spec") or {}
              containers = spec.get("containers") or []

              for container in containers:
                  ports = container.get("ports") or []
                  for port in ports:
                      container_port = port.get("containerPort")
                      if container_port:
                          return int(container_port)

              return 80


          def ensure_debug_nodeport_service(name: str, namespace: str, body: dict, logger):
              if namespace in SYSTEM_NAMESPACES:
                  return

              metadata = body.get("metadata") or {}
              annotations = metadata.get("annotations") or {}

              if not debug_enabled(annotations):
                  return

              service_name = f"debug-{name}"
              container_port = find_container_port(body)

              selector_label_key = "lab12-debug"
              selector_label_value = name

              core.patch_namespaced_pod(
                  name=name,
                  namespace=namespace,
                  body={
                      "metadata": {
                          "labels": {
                              selector_label_key: selector_label_value
                          },
                          "annotations": {
                              "operator/debug-service": service_name
                          },
                      }
                  },
              )

              service = client.V1Service(
                  metadata=client.V1ObjectMeta(
                      name=service_name,
                      namespace=namespace,
                      labels={
                          "app.kubernetes.io/managed-by": "namespace-operator",
                          "lab": "lab12",
                      },
                  ),
                  spec=client.V1ServiceSpec(
                      type="NodePort",
                      selector={
                          selector_label_key: selector_label_value
                      },
                      ports=[
                          client.V1ServicePort(
                              name="debug",
                              protocol="TCP",
                              port=container_port,
                              target_port=container_port,
                          )
                      ],
                  ),
              )

              try:
                  core.create_namespaced_service(namespace=namespace, body=service)
                  logger.info(
                      f"Created NodePort Service {namespace}/{service_name} for Pod {name} on port {container_port}"
                  )
              except ApiException as e:
                  if e.status == 409:
                      core.patch_namespaced_service(
                          name=service_name,
                          namespace=namespace,
                          body=service,
                      )
                      logger.info(
                          f"Patched existing NodePort Service {namespace}/{service_name}"
                      )
                  else:
                      raise


          @kopf.on.create("", "v1", "pods")
          def on_pod_create(name, namespace, body, logger, **kwargs):
              logger.info(f"Pod created: {namespace}/{name}")
              validate_pod_resources(name, namespace, body, logger)
              ensure_debug_nodeport_service(name, namespace, body, logger)


          @kopf.on.resume("", "v1", "pods")
          def on_pod_resume(name, namespace, body, logger, **kwargs):
              validate_pod_resources(name, namespace, body, logger)
              ensure_debug_nodeport_service(name, namespace, body, logger)


          @kopf.on.field("", "v1", "pods", field="metadata.annotations")
          def on_pod_annotation_change(name, namespace, body, logger, **kwargs):
              logger.info(f"Pod annotations changed: {namespace}/{name}")
              ensure_debug_nodeport_service(name, namespace, body, logger)

    - name: Write Dockerfile for operator
      copy:
        dest: "{{ operator_dir }}/Dockerfile"
        owner: vagrant
        group: vagrant
        mode: "0644"
        content: |
          FROM python:3.11-slim

          WORKDIR /app

          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt

          COPY operator.py .

          CMD ["kopf", "run", "--standalone", "--all-namespaces", "/app/operator.py"]

    - name: Build operator Docker image fresh every time
      shell: docker build --no-cache -t {{ operator_image }} {{ operator_dir }}
      changed_when: true

    - name: Remove old operator image from containerd if exists
      shell: ctr -n k8s.io images rm docker.io/library/{{ operator_image }} || true
      changed_when: false

    - name: Import operator image into containerd
      shell: docker save {{ operator_image }} | ctr -n k8s.io images import -
      changed_when: true

    - name: Write operator RBAC and Deployment manifest
      copy:
        dest: "{{ operator_dir }}/operator-manifest.yaml"
        owner: vagrant
        group: vagrant
        mode: "0644"
        content: |
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: namespace-operator
            namespace: kube-system
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: namespace-operator
          rules:
            - apiGroups: [""]
              resources: ["namespaces"]
              verbs: ["get", "list", "watch", "patch", "update"]

            - apiGroups: [""]
              resources: ["pods"]
              verbs: ["get", "list", "watch", "patch", "update"]

            - apiGroups: [""]
              resources: ["services"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

            - apiGroups: ["rbac.authorization.k8s.io"]
              resources: ["roles", "rolebindings"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

            - apiGroups: [""]
              resources: ["events"]
              verbs: ["create", "patch"]

          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: namespace-operator
          subjects:
            - kind: ServiceAccount
              name: namespace-operator
              namespace: kube-system
          roleRef:
            kind: ClusterRole
            name: namespace-operator
            apiGroup: rbac.authorization.k8s.io
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: namespace-operator
            namespace: kube-system
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: namespace-operator
            template:
              metadata:
                labels:
                  app: namespace-operator
              spec:
                serviceAccountName: namespace-operator
                containers:
                  - name: operator
                    image: namespace-operator:latest
                    imagePullPolicy: Never

    - name: Apply operator manifests
      shell: kubectl apply -f {{ operator_dir }}/operator-manifest.yaml
      changed_when: false

    - name: Restart operator deployment after image update
      shell: kubectl rollout restart deployment/{{ operator_deployment }} -n {{ operator_namespace }}
      changed_when: false

    - name: Wait for operator rollout
      shell: kubectl rollout status deployment/{{ operator_deployment }} -n {{ operator_namespace }} --timeout=180s
      changed_when: false

    - name: Give Kopf operator time to start watches
      shell: sleep 15
      changed_when: false

    - name: Show operator pod
      shell: kubectl get pods -n {{ operator_namespace }} -l app={{ operator_deployment }} -o wide
      register: operator_pods
      changed_when: false

    - name: Print operator pod
      debug:
        msg: "{{ operator_pods.stdout_lines }}"

    - name: Delete old test namespace
      shell: kubectl delete namespace {{ test_namespace }} --ignore-not-found
      changed_when: false

    - name: Wait until old test namespace is deleted
      shell: kubectl wait --for=delete namespace/{{ test_namespace }} --timeout=120s || true
      changed_when: false

    - name: Create test namespace
      shell: kubectl create namespace {{ test_namespace }}
      changed_when: true

    - name: Wait for RoleBindings to be created by operator
      shell: |
        kubectl get rolebinding {{ test_namespace }}-viewers -n {{ test_namespace }} &&
        kubectl get rolebinding {{ test_namespace }}-editors -n {{ test_namespace }} &&
        kubectl get rolebinding {{ test_namespace }}-admins  -n {{ test_namespace }}
      register: rolebinding_check
      retries: 12
      delay: 5
      until: rolebinding_check.rc == 0
      changed_when: false

    - name: Print Roles and RoleBindings
      shell: kubectl get roles,rolebindings -n {{ test_namespace }}
      register: rbac_output
      changed_when: false

    - name: Show RBAC output
      debug:
        msg: "{{ rbac_output.stdout_lines }}"

    - name: Create Edge test pod without resource limits
      shell: |
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: Pod
        metadata:
          name: edge-test
          namespace: {{ test_namespace }}
        spec:
          containers:
            - name: nginx
              image: nginx:alpine
        EOF
      changed_when: true

    - name: Wait for Edge resource-warning annotation
      shell: |
        kubectl get pod edge-test -n {{ test_namespace }} -o json | grep -q "operator/resource-warning"
      register: edge_annotation_check
      retries: 12
      delay: 5
      until: edge_annotation_check.rc == 0
      changed_when: false

    - name: Print Edge annotation value
      shell: kubectl get pod edge-test -n {{ test_namespace }} -o jsonpath='{.metadata.annotations}'
      register: edge_annotation
      changed_when: false

    - name: Show Edge annotation
      debug:
        msg: "{{ edge_annotation.stdout }}"

    - name: Create Target test pod with debug annotation and containerPort
      shell: |
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: Pod
        metadata:
          name: debug-test
          namespace: {{ test_namespace }}
          annotations:
            debug: "true"
        spec:
          containers:
            - name: nginx
              image: nginx:alpine
              ports:
                - containerPort: 80
        EOF
      changed_when: true

    - name: Wait for debug NodePort service to appear
      shell: kubectl get svc debug-debug-test -n {{ test_namespace }}
      register: debug_service_check
      retries: 12
      delay: 5
      until: debug_service_check.rc == 0
      changed_when: false

    - name: Print debug service
      shell: kubectl get svc debug-debug-test -n {{ test_namespace }} -o wide
      register: debug_service_output
      changed_when: false

    - name: Show debug service
      debug:
        msg: "{{ debug_service_output.stdout_lines }}"

    - name: Show operator logs
      shell: kubectl logs -n {{ operator_namespace }} deployment/{{ operator_deployment }} --tail=100
      register: operator_logs
      changed_when: false

    - name: Print operator logs
      debug:
        msg: "{{ operator_logs.stdout_lines }}"