- name: Lab 12 
  hosts: all
  become: yes
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:

    - name: Wait for cloud-init
      shell: cloud-init status --wait
      args:
        executable: /bin/bash

    - name: Install ca-certificates
      apt:
        name: ca-certificates
        state: present

    - name: Fix Ubuntu ports mirror to HTTPS
      replace:
        path: /etc/apt/sources.list
        regexp: 'http://ports.ubuntu.com'
        replace: 'https://ports.ubuntu.com'

    - name: apt update
      apt:
        update_cache: yes

    - name: Disable swap if enabled
      shell: |
        if swapon --summary | grep -q '^'; then
          swapoff -a
        fi

    - name: Permanently disable swap
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+.*)$'
        replace: '# \1'

    - name: Install system dependencies
      apt:
        name:
          - apt-transport-https
          - curl
          - gnupg
          - lsb-release
          - nfs-common
          - open-iscsi
          - python3-pip
          - docker.io

        state: present

    - name: Enable iscsid
      systemd:
        name: iscsid
        state: started
        enabled: yes

    - name: Enable docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Install containerd
      apt:
        name: containerd
        state: present

    - name: Create ContainerD config
      shell: |
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml 
        sed -i "s/SystemdCgroup = false/SystemdCgroup = true/g" /etc/containerd/config.toml 
      notify: Restart ContainerD

    - name: Load br_netfilter
      modprobe:
        name: br_netfilter
        state: present

    - name: Br_netfilter load on boot
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          br_netfilter

    - name: sysctl for Kubernetes
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-ip6tables = 1
          net.bridge.bridge-nf-call-iptables  = 1
          net.ipv4.ip_forward                 = 1
      notify: Reload sysctl

    - name: Apply sysctl now
      command: sysctl --system

    - name: Force Google DNS
      lineinfile:
        path: /etc/resolv.conf
        line: "nameserver 8.8.8.8"
        insertbefore: BOF


    - name: Make keyrings directory 
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Kubernetes GPG key 
      shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.35/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes apt repository
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.35/deb/ /'

    - name: Update apt cache after adding Kubernetes repo
      apt:
        update_cache: yes

    - name: Install kubeadm, kubelet, kubectl
      apt:
        name:
          - kubeadm
          - kubelet 
          - kubectl
        state: present

    - name: apt update after k8s repo
      apt:
        update_cache: yes

    - name: Install kubeadm kubelet kubectl
      apt:
        name:
          - kubeadm
          - kubelet
          - kubectl
        state: present

    - name: Hold k8s packages
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [kubeadm, kubelet, kubectl]

    - name: Pre-pull kubeadm images
      command: kubeadm config images pull
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Cluster initialization with kubeadm
      command: kubeadm init --pod-network-cidr=10.244.0.0/16 --apiserver-advertise-address=192.168.56.10
      args:
        creates: /etc/kubernetes/admin.conf
      run_once: true

    - name: .kube for root
      file:
        path: /root/.kube
        state: directory
        mode: '0755'


    - name: Create .kube directory for root
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: '0755'

    - name: Copy admin.conf to root kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes
        owner: root
        group: root
        mode: '0600'

    - name: Create .kube directory for vagrant
      ansible.builtin.file:
        path: /home/vagrant/.kube
        state: directory
        owner: vagrant
        group: vagrant
        mode: '0755'

    - name: Remove control-plane taint
      shell: kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true

    - name: Install Calico CNI
      shell: |
        kubectl apply -f https://docs.projectcalico.org/manifests/calico.yaml
        kubectl set env daemonset/calico-node -n kube-system \
          IP_AUTODETECTION_METHOD=interface=eth1 \
          CALICO_IPV4POOL_CIDR=10.244.0.0/16 || true
      run_once: true

    - name: Wait for node ready
      shell: kubectl wait --for=condition=Ready nodes --all --timeout=300s
      ignore_errors: yes


    - name: Create operator build directory
      file:
        path: /home/vagrant/namespace-operator
        state: directory
        owner: vagrant
        group: vagrant

    - name: Write operator.py
      copy:
        dest: /home/vagrant/namespace-operator/operator.py
        content: |
          import kopf
          import kubernetes

          SKIP = {'default', 'kube-system', 'kube-public', 'kube-node-lease'}

          @kopf.on.create('namespaces')
          def on_namespace_create(name, logger, **kwargs):
              if name in SKIP or name.startswith('kube-'):
                  logger.info(f"Skipping system namespace: {name}")
                  return

              kubernetes.config.load_incluster_config()
              rbac = kubernetes.client.RbacAuthorizationV1Api()

              bindings = [
                  (f"{name}:viewers", "view",  f"{name}:viewers"),
                  (f"{name}:editors", "edit",  f"{name}:editors"),
                  (f"{name}:admins",  "admin", f"{name}:admins"),
              ]

              for binding_name, cluster_role, group_name in bindings:
                  body = kubernetes.client.V1RoleBinding(
                      metadata=kubernetes.client.V1ObjectMeta(
                          name=binding_name,
                          namespace=name,
                          annotations={"managed-by": "namespace-operator"},
                      ),
                      role_ref=kubernetes.client.V1RoleRef(
                          api_group="rbac.authorization.k8s.io",
                          kind="ClusterRole",
                          name=cluster_role,
                      ),
                      subjects=[kubernetes.client.V1Subject(
                          kind="Group",
                          name=group_name,
                          api_group="rbac.authorization.k8s.io",
                      )],
                  )
                  try:
                      rbac.create_namespaced_role_binding(namespace=name, body=body)
                      logger.info(f"Created RoleBinding {binding_name} in {name}")
                  except kubernetes.client.exceptions.ApiException as e:
                      if e.status == 409:
                          logger.info(f"RoleBinding {binding_name} already exists")
                      else:
                          raise

    - name: Write Dockerfile for operator
      copy:
        dest: /home/vagrant/namespace-operator/Dockerfile
        content: |
          FROM python:3.11-slim
          WORKDIR /app
          RUN pip install --no-cache-dir kopf kubernetes
          COPY operator.py .
          CMD ["kopf", "run", "--all-namespaces", "/app/operator.py"]

    - name: Build operator Docker image
      shell: |
        docker build -t namespace-operator:latest /home/vagrant/namespace-operator/
      args:
        creates: /tmp/operator-image-built

    - name: Mark image as built
      file:
        path: /tmp/operator-image-built
        state: touch

    - name: Export image from docker and import into containerd
      shell: |
        docker save namespace-operator:latest | \
          ctr -n k8s.io images import -
      args:
        creates: /tmp/operator-image-imported

    - name: Mark image as imported
      file:
        path: /tmp/operator-image-imported
        state: touch

    - name: Write operator RBAC + Deployment manifest
      copy:
        dest: /home/vagrant/namespace-operator/deploy.yaml
        content: |
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: namespace-operator
            namespace: kube-system

          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: namespace-operator
          rules:
            - apiGroups: [""]
              resources: ["namespaces"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["rbac.authorization.k8s.io"]
              resources: ["rolebindings"]
              verbs: ["get", "list", "watch", "create", "update", "patch"]
            - apiGroups: [""]
              resources: ["events"]
              verbs: ["create", "patch"]
            - apiGroups: ["coordination.k8s.io"]
              resources: ["leases"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: namespace-operator
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: namespace-operator
          subjects:
            - kind: ServiceAccount
              name: namespace-operator
              namespace: kube-system

          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: namespace-operator
            namespace: kube-system
            labels:
              app: namespace-operator
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: namespace-operator
            template:
              metadata:
                labels:
                  app: namespace-operator
              spec:
                serviceAccountName: namespace-operator
                containers:
                  - name: operator
                    image: namespace-operator:latest
                    imagePullPolicy: Never
                    resources:
                      requests:
                        cpu: "50m"
                        memory: "64Mi"
                      limits:
                        cpu: "200m"
                        memory: "128Mi"

    - name: Apply operator manifests
      shell: kubectl apply -f /home/vagrant/namespace-operator/deploy.yaml
      run_once: true

    - name: Wait for operator pod ready
      shell: |
        kubectl wait --for=condition=Ready pod \
          -l app=namespace-operator \
          -n kube-system --timeout=120s

    - name: Create test namespace
      shell: kubectl create namespace team-alpha --dry-run=client -o yaml | kubectl apply -f -

    - name: Wait for RoleBindings to be created by operator
      shell: |
        sleep 5
        kubectl get rolebinding -n team-alpha
      register: rb_result

    - name: Confirm all three RoleBindings exist
      shell: |
        kubectl get rolebinding team-alpha:viewers -n team-alpha
        kubectl get rolebinding team-alpha:editors -n team-alpha
        kubectl get rolebinding team-alpha:admins  -n team-alpha
      register: confirm_result

    - name: Print RoleBinding confirmation
      debug:
        msg: "{{ confirm_result.stdout_lines }}"

  handlers:
    - name: Restart ContainerD
      service:
        name: containerd
        state: restarted

    - name: Reload sysctl
      command: sysctl --system
