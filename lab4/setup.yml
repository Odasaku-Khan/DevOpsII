- name: Setup
  hosts: all
  become: yes
  tasks:

    - name: Wait to become available
      shell: cloud-init status --wait
      args:
        executable: /bin/bash

    - name: Install ca-certificates
      apt:
        name: ca-certificates
        state: present

    - name: Pendejo aka MitMA problem
      replace:
        path: /etc/apt/sources.list
        regexp: 'http://ports.ubuntu.com'
        replace: 'https://ports.ubuntu.com'

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Disable swap if enabled
      shell: |
        if swapon --summary | grep -q '^'; then
          swapoff -a
        fi

    - name: Permanently disable swap
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+.*)$'
        replace: '# \1'

    - name: Install dependencies
      apt:
        name:
          - apt-transport-https
          - curl
          - gnupg
          - lsb-release
          - nmap
        state: present


    - name: Install ContainerD
      apt:
        name: containerd
        state: present

    - name: Create ContainerD config
      shell: |
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml
        sed -i "s/SystemdCgroup = false/SystemdCgroup = true/g" /etc/containerd/config.toml
      notify: Restart ContainerD


    - name: Load br_netfilter module
      modprobe:
        name: br_netfilter
        state: present

    - name: Br_netfilter load on boot
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          br_netfilter

    - name: Set sysctl params for Kubernetes
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-ip6tables = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward = 1
      notify: Reload sysctl

    - name: Apply sysctl params
      command: sysctl --system

    - name: Force Google DNS
      lineinfile:
        path: /etc/resolv.conf
        line: "nameserver 8.8.8.8"
        insertbefore: BOF


    - name: Make keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Kubernetes GPG key
      shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.35/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes apt repository
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.35/deb/ /'

    - name: Update apt cache after adding Kubernetes repo
      apt:
        update_cache: yes

    - name: Install kubeadm, kubelet, kubectl
      apt:
        name:
          - kubeadm
          - kubelet
          - kubectl
        state: present

    - name: Pre pull images for kubeadm init
      command: kubeadm config images pull

    - name: Cluster initialization with kubeadm
      command: kubeadm init --pod-network-cidr=10.244.0.0/16 --apiserver-advertise-address=192.168.56.10

    - name: Hold kubeadm, kubelet, kubectl at current version
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [kubeadm, kubelet, kubectl]

    - name: Set up kubeconfig for root
      shell: |
        mkdir -p $HOME/.kube
        cp -i /etc/kubernetes/admin.conf $HOME/.kube/config
        chown $(id -u):$(id -g) $HOME/.kube/config

    - name: Set up kubeconfig for vagrant user
      shell: |
        mkdir -p /home/vagrant/.kube
        cp -i /etc/kubernetes/admin.conf /home/vagrant/.kube/config
        chown vagrant:vagrant /home/vagrant/.kube/config

    - name: Remove control-plane taint so pods can schedule on single node
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true

    # ── CNI + Ingress ─────────────────────────────────────────────────────────

    - name: Install Calico CNI
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl apply -f https://docs.projectcalico.org/manifests/calico.yaml
        kubectl set env daemonset/calico-node -n kube-system \
          IP_AUTODETECTION_METHOD=interface=eth1 \
          CALICO_IPV4POOL_CIDR=10.244.0.0/16 || true

    - name: Wait for all nodes to be ready
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl wait --for=condition=Ready nodes --all --timeout=300s

    - name: Install Nginx Ingress Controller
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.7.0/deploy/static/provider/cloud/deploy.yaml

    #   ns/protected  — where best-effort-app lives, guarded by LimitRange + ResourceQuota
    #   ns/chaos      — where burstable hogs run, no quota, causes node pressure

    - name: Create protected namespace
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl create namespace protected --dry-run=client -o yaml | kubectl apply -f -

    - name: Create chaos namespace
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl create namespace chaos --dry-run=client -o yaml | kubectl apply -f -

    - name: LimitRange manifest for protected namespace
      copy:
        dest: /tmp/limitrange.yaml
        content: |
          apiVersion: v1
          kind: LimitRange
          metadata:
            name: protected-limits
            namespace: protected
          spec:
            limits:
            - type: Container
              # Any container without explicit requests gets these injected automatically
              # This prevents pods from being BestEffort by accident
              default:
                memory: "128Mi"
                cpu: "200m"
              defaultRequest:
                memory: "64Mi"
                cpu: "100m"
              # Hard ceiling per container — no single app can hog the namespace
              max:
                memory: "256Mi"
                cpu: "500m"
              # Minimum to ensure pods always have some guaranteed resources
              min:
                memory: "32Mi"
                cpu: "50m"

    - name: Apply LimitRange to protected namespace
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl apply -f /tmp/limitrange.yaml

    - name: ResourceQuota manifest for protected namespace
      copy:
        dest: /tmp/resourcequota.yaml
        content: |
          apiVersion: v1
          kind: ResourceQuota
          metadata:
            name: protected-quota
            namespace: protected
          spec:
            hard:
              # Total memory allowed across all pods in this namespace
              requests.memory: "500Mi"
              limits.memory: "1Gi"
              requests.cpu: "500m"
              limits.cpu: "2"
              # Max number of pods — prevents runaway deployments
              pods: "10"
              # Block BestEffort pods entirely from this namespace
              # Only Burstable or Guaranteed pods are allowed
              count/pods: "10"
              # This scope selector rejects any pod with no resource requests
              # (which would make it BestEffort and vulnerable to eviction)

    - name: Apply ResourceQuota to protected namespace
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl apply -f /tmp/resourcequota.yaml

    - name: BestEffort scope quota — blocks BestEffort pods in protected ns
      copy:
        dest: /tmp/quota-no-besteffort.yaml
        content: |
          apiVersion: v1
          kind: ResourceQuota
          metadata:
            name: no-best-effort
            namespace: protected
          spec:
            hard:
              pods: "0"
            scopeSelector:
              matchExpressions:
              - operator: In
                scopeName: BestEffort

    - name: Apply BestEffort scope quota
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl apply -f /tmp/quota-no-besteffort.yaml

    # ── EDGE: nginx + scraper in protected namespace ──────────────────────────

    - name: Nginx pod manifest
      copy:
        dest: /tmp/nginx-pod.yaml
        content: |
          apiVersion: v1
          kind: Pod
          metadata:
            name: nginx
            namespace: protected
            labels:
              app: nginx
          spec:
            containers:
            - name: nginx
              image: nginx:latest
              ports:
              - containerPort: 80
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "100m"
                limits:
                  memory: "128Mi"
                  cpu: "200m"
              livenessProbe:
                httpGet:
                  path: /
                  port: 80
                initialDelaySeconds: 5
                periodSeconds: 5
                failureThreshold: 3

    - name: Create nginx pod
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl apply -f /tmp/nginx-pod.yaml

    - name: Scraper pod manifest
      copy:
        dest: /tmp/scraper-pod.yaml
        content: |
          apiVersion: v1
          kind: Pod
          metadata:
            name: scraper
            namespace: protected
          spec:
            containers:
            - name: scraper
              image: curlimages/curl:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  while true; do
                    curl -s https://raw.githubusercontent.com/Odasaku-Khan/Web-Dev/main/project/front_job_search/src/index.html \
                      -o /tmp/index.html && echo "Updated at $(date)"
                    sleep 10
                  done
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "50m"
                limits:
                  memory: "64Mi"
                  cpu: "100m"
              livenessProbe:
                exec:
                  command:
                    - test
                    - -f
                    - /tmp/index.html
                initialDelaySeconds: 15
                periodSeconds: 10
                failureThreshold: 3

    - name: Create scraper pod
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl apply -f /tmp/scraper-pod.yaml

    # ── TARGET: QoS eviction simulation in chaos namespace ───────────────────

    - name: Taint the node as overload target
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl taint nodes --all overload=true:NoSchedule --overwrite || true

    - name: Best Effort pod manifest (in chaos ns for comparison)
      copy:
        dest: /tmp/best-effort-pod.yaml
        content: |
          apiVersion: v1
          kind: Pod
          metadata:
            name: best-effort-app
            namespace: chaos
            labels:
              qos: best-effort
          spec:
            tolerations:
            - key: "overload"
              operator: "Equal"
              value: "true"
              effect: "NoSchedule"
            containers:
            - name: app
              image: nginx:latest
              # no resources block → QoS class: BestEffort

    - name: Create Best Effort pod
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl apply -f /tmp/best-effort-pod.yaml

    - name: Burstable hogs manifest (in chaos ns)
      copy:
        dest: /tmp/burstable-pods.yaml
        content: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: burstable-hogs
            namespace: chaos
          spec:
            replicas: 5
            selector:
              matchLabels:
                qos: burstable
            template:
              metadata:
                labels:
                  qos: burstable
              spec:
                tolerations:
                - key: "overload"
                  operator: "Equal"
                  value: "true"
                  effect: "NoSchedule"
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                      - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: Exists
                containers:
                - name: memory-hog
                  image: polinux/stress
                  args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]
                  resources:
                    requests:
                      memory: "64Mi"
                      cpu: "50m"
                    limits:
                      memory: "200Mi"
                      cpu: "200m"

    - name: Create Burstable hog deployment
      shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl apply -f /tmp/burstable-pods.yaml

  handlers:
    - name: Restart ContainerD
      systemd:
        name: containerd
        state: restarted

    - name: Reload sysctl
      command: sysctl --system

