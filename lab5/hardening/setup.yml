- name: Setup Kubernetes 
  hosts: all
  become: yes 
  tasks: 
    - name: Wait to finish ubuntu init 
      shell: cloud-init status --wait
      args:
        executable: /bin/bash
    - name: Fix goddamn MiTM problem on mirror 
      replace: 
        path: /etc/apt/sources.list
        regexp: 'http://ports.ubuntu.com' 
        replace: 'https://ports.ubuntu.com'

    - name: Update apt cache 
      apt: 
        update_cache: yes 

    - name: Disable Swap
      command: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Make it permanent
      replace: 
        path: /etc/fstab
        regexp: '^.*swap.*$'
        replace: ''
    
    - name: Install Container 
      apt:
        name: containerd
        state: present 

    
    - name: Containerd config 
      shell: | 
        mkdir -p /etc/containerd 
        containerd config default > /etc/containerd/config.toml 
        sed -i "s/SystemdCgroup = false/SystemdCgroup = true/" /etc/containerd/config.toml
      notify: Restart Containerd

    - name: Intsall br_netfilter 
      modprobe:
        name: br_netfilter
        state: present

    - name: Make it Load on boot 
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          br_netfilter

    - name: Set sysctl params for Kubernetes
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-ip6tables = 1

    - name: Apply sysctl params
      command: sysctl --system


    - name: Directory for keyring
      file: 
        path: /etc/apt/keyrings 
        state: directory
        mode: "0755"

    - name: Install dependecies 
      apt:
        name: 
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
          - wget
        state: present    

    - name: Install GPG keyring 
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc

    - name: Add Kubernetes apt repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v1.29/deb/ /"
        state: present

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install kubeadm, kubelet and kubectl
      apt:
        name: 
          - kubelet
          - kubeadm 
          - kubectl
        state: present

    - name: wait for download to finish
      pause:
        seconds: 40

    - name: Configure systemd-resolved
      shell: |
        mkdir -p /etc/systemd/resolved.conf.d/
        cat > /etc/systemd/resolved.conf.d/k8s.conf <<EOF
        [Resolve]
        DNS=8.8.8.8 8.8.4.4
        FallbackDNS=1.1.1.1
        EOF
        systemctl restart systemd-resolved
      when: "'master' in group_names"

    - name: Verify DNS resolution
      shell: nslookup kubernetes.default.svc || echo "DNS pending"
      when: "'master' in group_names"

    - name: pre pull images
      shell: kubeadm config images pull
      when: "'master' in group_names"
    
    - name: Cluster init 
      shell: timeout 600 kubeadm init --pod-network-cidr=192.168.0.0/16 2>&1 | tee /root/kubeadm-init.log
      when: "'master' in group_names"
      args: 
        creates: /etc/kubernetes/admin.conf

    - name: Export KUBECONFIG
      shell: export KUBECONFIG=/etc/kubernetes/admin.conf

    - name: Create .kube directory
      shell: |
        mkdir -p $HOME/.kube
        cp -i /etc/kubernetes/admin.conf $HOME/.kube/config
        sudo chown $(id -u):$(id -g) $HOME/.kube/config
      when: "'master' in group_names"

    - name: Install Flannel network (CNI)
      shell: |
        kubectl apply -f https://raw.githubusercontent.com/flannel-io/flannel/v0.26.0/Documentation/kube-flannel.yml
      when: "'master' in group_names"

    - name: Allow scheduling on master node
      shell: kubectl taint nodes --all node-role.kubernetes.io/control-plane-
      when: "'master' in group_names"

    - name: Wait for all nodes to be Ready
      shell: kubectl wait --for=condition=Ready nodes --all --timeout=300s
      when: "'master' in group_names"

    - name: Simple Pod manifest
      copy:
        dest: /root/pod.yaml
        content: |
          apiVersion: v1
          kind: Pod 
          metadata:
            name: nginx 
          spec:
            containers:
            - name: nginx
              image: nginx:latest
              ports:
              - containerPort: 80          

    - name: Wait for cluster to be ready (check nodes)
      shell: kubectl get nodes --no-headers | grep -v NotReady || true
      when: "'master' in group_names"
      retries: 15
      delay: 10
      register: nodes_ready
      until: nodes_ready.stdout_lines | length > 0

    - name: Wait for service account to be ready 
      shell: kubectl wait --for=condition=Ready serviceaccount default -n default --timeout=120s
      when: "'master' in group_names"                    

    - name: Apply Pod manifest 
      shell: kubectl apply -f /root/pod.yaml
      when: "'master' in group_names"

    - name: Hardening Pod manifest 
      copy: 
        dest: /root/hardening-pod.yaml
        content: |
          apiVersion: v1
          kind: Pod
          metadata:
            name: nginx-secure
          spec:
            automountServiceAccountToken: false
            containers:
            - name: nginx
              image: nginx:latest
              ports:
              - containerPort: 80
              securityContext:
                runAsUser: 1000
                runAsGroup: 3000
                fsGroup: 2000
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                allowPrivilegeEscalation: false

    - name: Apply hardening Pod manifest 
      shell: kubectl apply -f /root/hardening-pod.yaml
      when: "'master' in group_names"
      

    - name: Restart kubelet 
      systemd:
        name: kubelet
        state: restarted


    
  handlers:
  - name: Restart Containerd
    service:
        name: containerd
        state: restarted