apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik-green
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Odasaku-Khan/DevOpsII.git
    targetRevision: main
    path: project/helm-charts/authentik
    helm:
      valueFiles:
        - values.yaml
        - values-green.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true