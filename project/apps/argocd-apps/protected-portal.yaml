apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: protected-portal
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Odasaku-Khan/DevOpsII.git
    targetRevision: main
    path: project/apps/protected-portal
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
