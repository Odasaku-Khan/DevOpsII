apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: postgres
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source: 
    repoURL: https://github.com/Odasaku-Khan/DevOpsII.git
    targetRevision: main
    path: project/helm-charts/postgresql
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: postgresqlPassword
          valueFrom:
            secretKeyRef:
              name: postgres-db
              key: password
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Validate=false


  