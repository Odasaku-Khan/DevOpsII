apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Odasaku-Khan/DevOpsII
    targetRevision: main
    path: project/helm-charts/keycloak
    helm:
      valueFiles:
        - values.yaml
      parameters:
        secretKeyRef:
          name: keycloak-db
          key: password
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Validate=false
      