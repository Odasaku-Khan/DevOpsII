apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-blue-html
  namespace: demo-app
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Protected Portal - Blue</title>
      <style>
        body {
          margin: 0;
          min-height: 100vh;
          font-family: Arial, sans-serif;
          background: #0f172a;
          color: white;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .page {
          width: min(1000px, 92vw);
          text-align: center;
        }
        p {
          color: #cbd5e1;
        }
        .video-wrapper {
          position: relative;
          width: 100%;
          padding-bottom: 56.25%;
          height: 0;
          border-radius: 18px;
          overflow: hidden;
          background: black;
        }
        iframe {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          border: 0;
        }
        .badge {
          display: inline-block;
          margin-top: 20px;
          padding: 8px 14px;
          border-radius: 999px;
          background: rgba(59, 130, 246, 0.2);
          color: #93c5fd;
        }
      </style>
    </head>
    <body>
      <main class="page">
        <h1>Protected Internal Portal - BLUE</h1>
        <p>This protected video page is served from Kubernetes behind Authentik.</p>
        <div class="video-wrapper">
          <iframe
            src="https://www.youtube.com/embed/9Mnv2r2cHJA"
            title="Protected Demo Video"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>
        </div>
        <div class="badge">Blue release · Authentik protected · GitOps</div>
      </main>
    </body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-green-html
  namespace: demo-app
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Protected Portal - Green</title>
      <style>
        body {
          margin: 0;
          min-height: 100vh;
          font-family: Arial, sans-serif;
          background: #111827;
          color: white;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .page {
          width: min(1000px, 92vw);
          text-align: center;
        }
        p {
          color: #d1d5db;
        }
        .video-wrapper {
          position: relative;
          width: 100%;
          padding-bottom: 56.25%;
          height: 0;
          border-radius: 18px;
          overflow: hidden;
          background: black;
        }
        iframe {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          border: 0;
        }
        .badge {
          display: inline-block;
          margin-top: 20px;
          padding: 8px 14px;
          border-radius: 999px;
          background: rgba(34, 197, 94, 0.2);
          color: #86efac;
        }
      </style>
    </head>
    <body>
      <main class="page">
        <h1>Protected Internal Portal - GREEN</h1>
        <p>This is the updated green release of the protected video portal.</p>
        <div class="video-wrapper">
          <iframe
            src="https://www.youtube.com/embed/9Mnv2r2cHJA"
            title="Protected Demo Video"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>
        </div>
        <div class="badge">Green release · Authentik protected · GitOps</div>
      </main>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-blue
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: protected-portal
      version: blue
  template:
    metadata:
      labels:
        app: protected-portal
        version: blue
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: html
          configMap:
            name: portal-blue-html
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-green
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: protected-portal
      version: green
  template:
    metadata:
      labels:
        app: protected-portal
        version: green
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: html
          configMap:
            name: portal-green-html
---
apiVersion: v1
kind: Service
metadata:
  name: protected-portal
  namespace: demo-app
spec:
  type: ClusterIP
  selector:
    app: protected-portal
    version: blue
  ports:
    - name: http
      port: 80
      targetPort: 80