apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: haproxy-controller-allow-kube-api-egress
  namespace: haproxy-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: haproxy-ingress
      app.kubernetes.io/instance: haproxy-ingress
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443