apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: haproxy-controller-allow-external-web-ingress
  namespace: haproxy-controller
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
