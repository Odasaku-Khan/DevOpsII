apiVersion: v1
kind: ResourceQuota
metadata:
  name: authentik-quota
  namespace: authentik
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "16"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: authentik-default-limits
  namespace: authentik
spec:
  limits:
    - type: Container
      default:
        cpu: 300m
        memory: 384Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: postgres-quota
  namespace: postgres
spec:
  hard:
    requests.cpu: "1000m"
    requests.memory: 1536Mi
    limits.cpu: "2000m"
    limits.memory: 3Gi
    pods: "6"
    persistentvolumeclaims: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: postgres-default-limits
  namespace: postgres
spec:
  limits:
    - type: Container
      default:
        cpu: 300m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
---
