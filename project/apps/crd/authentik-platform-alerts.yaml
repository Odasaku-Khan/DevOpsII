apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: authentik-platform-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: authentik-platform.rules
      rules:
        - alert: AuthentikServiceNoEndpoints
          expr: kube_endpoint_address_available{namespace="authentik", endpoint="authentik"} == 0
          for: 1m
          labels:
            severity: critical
            app: authentik
          annotations:
            summary: "Authentik shared Service has no ready endpoints"
            description: "The authentik Service has no available endpoint. Blue/Green selector may point to a non-ready color."

        - alert: AuthentikPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="authentik"}[5m]) > 0
          for: 1m
          labels:
            severity: warning
            app: authentik
          annotations:
            summary: "Authentik pod restarted"
            description: "An Authentik pod restarted recently. Check logs for OOM, worker timeout, or database issues."

        - alert: PostgreSQLPVCAlmostFull
          expr: |
            (
              kubelet_volume_stats_used_bytes{namespace="postgres"}
              /
              kubelet_volume_stats_capacity_bytes{namespace="postgres"}
            ) > 0.80
          for: 5m
          labels:
            severity: warning
            app: postgres
          annotations:
            summary: "PostgreSQL PVC is above 80% usage"
            description: "The PostgreSQL persistent volume is filling up. Check Longhorn volume and database storage usage."

        - alert: MonitoringPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="monitoring"}[5m]) > 0
          for: 1m
          labels:
            severity: warning
            app: monitoring
          annotations:
            summary: "Monitoring component restarted"
            description: "A monitoring pod restarted recently. Check Prometheus, Grafana, Loki, or Promtail logs."