apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-app-default-deny
  namespace: demo-app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hello-video-allow-authentik-ingress
  namespace: demo-app
spec:
  podSelector:
    matchLabels:
      app: hello-video
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - protocol: TCP
          port: 80

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-allow-hello-video-egress
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: server
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: demo-app
          podSelector:
            matchLabels:
              app: hello-video
      ports:
        - protocol: TCP
          port: 80