apiVersion: v1
kind: Namespace
metadata:
  name: demo-app

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-video-html
  namespace: demo-app
data:
  index.html: |
    <!doctype html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>Hello from Authentik</title>
      <style>
        body {
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          background: radial-gradient(circle at top, #1e293b, #020617);
          color: white;
          height: 100vh;
          margin: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .card {
          width: 720px;
          padding: 36px;
          border-radius: 24px;
          background: rgba(15, 23, 42, 0.9);
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
          text-align: center;
          border: 1px solid rgba(148, 163, 184, 0.35);
        }
        h1 {
          font-size: 42px;
          margin-bottom: 12px;
        }
        p {
          font-size: 18px;
          color: #cbd5e1;
          line-height: 1.6;
        }
        .badge {
          display: inline-block;
          padding: 8px 14px;
          margin: 6px;
          border-radius: 999px;
          background: #0f766e;
          font-weight: 700;
        }
        a {
          display: inline-block;
          margin-top: 24px;
          padding: 14px 22px;
          border-radius: 14px;
          background: #38bdf8;
          color: #082f49;
          text-decoration: none;
          font-weight: 800;
        }
        .terminal {
          margin-top: 24px;
          padding: 16px;
          text-align: left;
          background: #020617;
          border-radius: 14px;
          color: #22c55e;
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>Protected Hello Video App</h1>
        <p>This page is served by Kubernetes, hidden behind Authentik Proxy Provider, because apparently even a hello-world page now needs enterprise-grade identity.</p>

        <div>
          <span class="badge">Kubernetes</span>
          <span class="badge">Authentik SSO</span>
          <span class="badge">NetworkPolicy</span>
          <span class="badge">GitOps</span>
        </div>

        <div class="terminal">
          $ whoami<br>
          authenticated-user<br><br>
          $ deployment<br>
          blue/green platform survived
        </div>

        <a href="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" target="_blank">
          Open Demo Video
        </a>
      </div>
    </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-video
  namespace: demo-app
  labels:
    app: hello-video
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-video
  template:
    metadata:
      labels:
        app: hello-video
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: hello-video-html

---
apiVersion: v1
kind: Service
metadata:
  name: hello-video
  namespace: demo-app
spec:
  type: ClusterIP
  selector:
    app: hello-video
  ports:
    - name: http
      port: 80
      targetPort: 80