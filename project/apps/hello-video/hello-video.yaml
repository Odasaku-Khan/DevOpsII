apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-video-html
  namespace: demo-app
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Protected YouTube Video</title>
      <style>
        body {
          margin: 0;
          min-height: 100vh;
          font-family: Arial, sans-serif;
          background: #0f172a;
          color: white;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .page {
          width: min(1000px, 92vw);
          text-align: center;
        }

        h1 {
          margin-bottom: 8px;
        }

        p {
          color: #cbd5e1;
          margin-bottom: 24px;
        }

        .video-wrapper {
          position: relative;
          width: 100%;
          padding-bottom: 56.25%;
          height: 0;
          border-radius: 18px;
          overflow: hidden;
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
          background: black;
        }

        .video-wrapper iframe {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          border: 0;
        }

        .badge {
          display: inline-block;
          margin-top: 20px;
          padding: 8px 14px;
          border-radius: 999px;
          background: rgba(34, 197, 94, 0.15);
          color: #86efac;
          font-size: 14px;
        }
      </style>
    </head>
    <body>
      <main class="page">
        <h1>Protected Demo Video</h1>
        <p>This video page is served from Kubernetes and protected through Authentik.</p>

        <div class="video-wrapper">
          <iframe
            src="https://www.youtube.com/embed/9Mnv2r2cHJA"
            title="Protected Demo Video"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>
        </div>

        <div class="badge">Kubernetes · Authentik · GitOps · Protected Video</div>
      </main>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-video
  namespace: demo-app
  labels:
    app: hello-video
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-video
  template:
    metadata:
      labels:
        app: hello-video
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: hello-video-html
---
apiVersion: v1
kind: Service
metadata:
  name: hello-video
  namespace: demo-app
spec:
  type: ClusterIP
  selector:
    app: hello-video
  ports:
    - name: http
      port: 80
      targetPort: 80