apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "authentik.fullname" . }}-worker
  labels:
    {{- include "authentik.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
    {{- with .Values.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  strategy:
    type: Recreate
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "authentik.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "authentik.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        {{- with .Values.extraLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args:
            - {{ .Values.worker.command | quote }}
          volumeMounts:
            - name: media
              mountPath: /media
          env:
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: {{ .Values.authentik.postgresql.host | quote }}
            - name: AUTHENTIK_POSTGRESQL__PORT
              value: {{ .Values.authentik.postgresql.port | quote }}
            - name: AUTHENTIK_POSTGRESQL__NAME
              value: {{ .Values.authentik.postgresql.name | quote }}
            - name: AUTHENTIK_POSTGRESQL__USER
              value: {{ .Values.authentik.postgresql.user | quote }}
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "authentik.postgresql.existingSecret is required" .Values.authentik.postgresql.existingSecret | quote }}
                  key: {{ .Values.authentik.postgresql.passwordKey | quote }}
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "authentik.secret.existingSecret is required" .Values.authentik.secret.existingSecret | quote }}
                  key: {{ .Values.authentik.secret.secretKeyKey | quote }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f 'worker' || exit 1"
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: media
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
