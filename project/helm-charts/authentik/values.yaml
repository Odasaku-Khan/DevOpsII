replicaCount: 1

image:
  repository: ghcr.io/goauthentik/server
  tag: "2025.10.4"
  pullPolicy: IfNotPresent

authentik:
  secretKey: "645KillerS"

  bootstrap:
    password: "admin12345"
    email: "admin@authentik.local"
    token: "devops-final-token"

  postgresql:
    host: "postgres-postgresql.postgres.svc.cluster.local"
    port: 5432
    name: "authentik"
    user: "authentik"
    password: "authentik"

extraLabels: {}

server:
  command: "server"

worker:
  command: "worker"
  replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 9000

ingress:
  enabled: true
  className: "haproxy"
  annotations:
    kubernetes.io/ingress.class: "haproxy"
  hosts:
    - host: authentik.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70

nodeSelector:
  workload: apps

tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsUser: 999
  runAsGroup: 999
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

serviceAccount:
  create: true
  automount: false