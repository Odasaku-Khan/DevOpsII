replicaCount: 1

image:
  repository: ghcr.io/goauthentik/server
  tag: "2025.10.4"
  pullPolicy: IfNotPresent

authentik:
  secretKey: "645Killer"
  postgresql:
    host: postgres-postgresql.postgres.svc.cluster.local
    port: "5432"
    user: authentik
    password: authentik
    name: authentik
  bootstrap:
    password: admin
    email: admin@example.com
    token: bootstrap-token

extraLabels: {}

server:
  command: "server"

worker:
  command: "worker"
  replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 9000

ingress:
  enabled: true
  className: "haproxy"
  annotations:
    kubernetes.io/ingress.class: "haproxy"
  hosts:
    - host: authentik.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70

nodeSelector:
  workload: apps

tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

serviceAccount:
  automount: false

media:
  enabled: true

startupProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
  httpGet:
    path: /-/health/live/
    port: 9000

readinessProbe:
  enabled: true
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 18
  httpGet:
    path: /-/health/ready/
    port: 9000

livenessProbe:
  enabled: true
  initialDelaySeconds: 240
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6
  httpGet:
    path: /-/health/live/
    port: 9000