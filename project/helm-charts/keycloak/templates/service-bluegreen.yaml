{{- if .Values.blueGreen.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: keycloak-active
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: keycloak
    version: {{ .Values.blueGreen.active | default "blue" }}
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
{{- end }}