
- name: Setup Load Balancer
  hosts: lb
  become: yes
  tasks:
    - name: Wait to become available
      shell: cloud-init status --wait
      args:
        executable: /bin/bash

    - name: Install HAProxy and Keepalived
      apt:
        name:
          - haproxy
          - keepalived
          - curl
        state: present
        update_cache: yes

    - name: Configure HAProxy for Kubernetes API load balancing
      copy:
        dest: /etc/haproxy/haproxy.cfg
        content: |
          global
              maxconn 4096
              log /dev/log local0
              log /dev/log local1 notice
              chroot /var/lib/haproxy
              stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
              stats timeout 30s
              user haproxy
              group haproxy
              ssl-default-bind-ciphers TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
              ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11
              daemon
          defaults
              log global
              mode tcp
              option tcplog
              option dontlognull
              timeout connect 10s
              timeout client 1m
              timeout server 1m
          frontend kubernetes-api
              bind *:6443
              default_backend kubernetes-api-backend
          backend kubernetes-api-backend
              balance roundrobin
              option tcp-check
              server master  192.168.56.10:6443 check
      notify: Restart HAProxy

    - name: Ensure HAProxy is started and enabled
      systemd:
        name: haproxy
        state: started
        enabled: yes

    - name: Configure Keepalived for VIP management
      copy:
        dest: /etc/keepalived/keepalived.conf
        content: |
          vrrp_instance VI_1 {
              state MASTER
              interface eth1
              virtual_router_id 51
              priority 100
              advert_int 1
              authentication {
                  auth_type PASS
                  auth_pass 42
              }
              virtual_ipaddress {
                  192.168.56.5
              }
          }
      notify: Restart Keepalived

    - name: Ensure Keepalived is started and enabled
      systemd:
        name: keepalived
        state: started
        enabled: yes

  handlers:
    - name: Restart HAProxy
      systemd:
        name: haproxy
        state: restarted
    - name: Restart Keepalived
      systemd:
        name: keepalived
        state: restarted

- name: Setup pre Kubernetes 
  hosts: master:worker:db
  become: yes
  tasks:
    - name: Wait to become available
      shell: cloud-init status --wait
      args:
        executable: /bin/bash

    - name: Disable swap
      command: swapoff -a
      ignore_errors: yes

    - name: Comment out swap in /etc/fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*swap.*)$'
        replace: '#\\1'

    - name: Replace http to https
      replace:
        path: /etc/apt/sources.list
        regexp: 'http://ports.ubuntu.com'
        replace: 'https://ports.ubuntu.com'

    - name: Load brnetfilter for iptables
      modprobe:
        name: br_netfilter
        state: present

    - name: Set sysctl parameters for Kubernetes networking
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-ip6tables = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward = 1
      notify: Reload sysctl


    - name: Ensure br_netfilter is loaded on boot
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          br_netfilter

    - name: Ensure sysctl parameters are applied
      command: sysctl --system

    - name: Force Google DNS for Kubernetes
      copy:
        dest: /etc/resolv.conf
        content: |
          nameserver 8.8.8.8
          nameserver 8.8.4.4

    - name: Make it immutable to prevent changes by DHCP client
      command: chattr +i /etc/resolv.conf
      ignore_errors: yes

    - name: Load necessary additional tools 
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - open-iscsi
          - util-linux
          - nfs-common
        state: present
        update_cache: yes

    - name: Load iscsi_tcp module
      modprobe:
        name: iscsi_tcp
        state: present

    - name: Enable and start iscsid service
      systemd:
        name: iscsid
        state: started
        enabled: yes

    - name: Install Containerd
      apt:
        name: containerd
        state: present
        update_cache: yes

    - name: Dir for configure Containerd
      ansible.builtin.file :
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Move default config for Containerd
      ansible.builtin.shell: "containerd config default > /etc/containerd/config.toml"
      args:
        creates: /etc/containerd/config.toml

    - name: Set SystemdCgroup to true in Containerd config
      lineinfile:
        path: /etc/containerd/config.toml
        regexp: '^(\s*)SystemdCgroup\s*=\s*false'
        line: '\1SystemdCgroup = true'
        backrefs: yes
      notify: Restart Containerd

    - name: Make keyrings directory 
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Kubernetes GPG key 
      shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.35/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes apt repository
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.35/deb/ /'

    - name: Update apt cache after adding Kubernetes repo
      apt:
        update_cache: yes

    - name: Install Helm
      shell: |
        curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        chmod 700 get_helm.sh
        ./get_helm.sh
      args:
        creates: /usr/local/bin/helm
      delegate_to: master
      
    - name: Install Kubernetes components
      apt:
        name:
          - kubeadm
          - kubelet
          - kubectl
        state: present
        update_cache: yes

    - name: Set kubelet node IP
      copy:
        dest: /etc/default/kubelet
        content: |
          KUBELET_EXTRA_ARGS=--node-ip={{ ansible_host }}
      notify: Restart kubelet

    - name: Hold kubeadm, kubelet, kubectl at current version
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [kubeadm, kubelet, kubectl]



  handlers:
    - name: Reload sysctl
      command: sysctl --system

    - name: Restart Containerd
      systemd:
        name: containerd
        state: restarted

    - name: Restart kubelet
      systemd:
        name: kubelet
        state: restarted
        daemon_reload: yes


- name: Move etc on DB node
  hosts: db
  become: yes
  tasks:
    - name: Wait to become available
      shell: cloud-init status --wait
      args:
        executable: /bin/bash

    - name: Create etcd group
      group:
        name: etcd
        state: present

    - name: Create etcd user
      user:
        name: etcd
        group: etcd
        shell: /sbin/nologin
        system: yes
        create_home: no
        state: present

    - name: Create etcd configuration directory
      file:
        path: /etc/etcd
        state: directory
        mode: '0755'

    - name: Stop and disable apt etcd
      systemd:
        name: etcd
        state: stopped
        enabled: no
      ignore_errors: yes

    - name: Remove apt etcd package
      apt:
        name: etcd
        state: absent
        purge: yes
    
    - name: Set etcd version and architecture
      set_fact:
        etcd_ver: "v3.5.24" 
        etcd_arch: "arm64"

    - name: Download etcd binary
      get_url:
        url: "https://github.com/etcd-io/etcd/releases/download/v3.5.24/etcd-v3.5.24-linux-arm64.tar.gz"
        dest: "/tmp/etcd.tar.gz"

    - name: Extract etcd binary
      unarchive:
        src: "/tmp/etcd.tar.gz"
        dest: "/tmp"
        remote_src: yes

    - name: Install etcd binaries to /usr/bin
      copy:
        src: "/tmp/etcd-{{ etcd_ver }}-linux-{{ etcd_arch }}/{{ item }}"
        dest: "/usr/bin/{{ item }}"
        mode: '0755'
        remote_src: yes
      loop:
        - etcd
        - etcdctl
        - etcdutl

    

    - name: Create etcd configuration directory
      file:
        path: /etc/etcd
        state: directory
        mode: '0755'

    - name: Configure etcd 
      copy:
        dest: /etc/default/etcd
        content: |
          ETCD_NAME="etcd-db"
          ETCD_DATA_DIR="/var/lib/etcd"
          ETCD_LISTEN_CLIENT_URLS="https://192.168.56.11:2379,https://127.0.0.1:2379"
          ETCD_ADVERTISE_CLIENT_URLS="https://192.168.56.11:2379"
          ETCD_LISTEN_PEER_URLS="https://192.168.56.11:2380"
          ETCD_INITIAL_ADVERTISE_PEER_URLS="https://192.168.56.11:2380"
          ETCD_INITIAL_CLUSTER="etcd-db=https://192.168.56.11:2380"
          ETCD_INITIAL_CLUSTER_STATE="new"
          ETCD_CERT_FILE="/etc/etcd/pki/server.crt"
          ETCD_KEY_FILE="/etc/etcd/pki/server.key"
          ETCD_TRUSTED_CA_FILE="/etc/etcd/pki/ca.crt"
          ETCD_CLIENT_CERT_AUTH="true"
          ETCD_PEER_CERT_FILE="/etc/etcd/pki/peer.crt"
          ETCD_PEER_KEY_FILE="/etc/etcd/pki/peer.key"
          ETCD_PEER_TRUSTED_CA_FILE="/etc/etcd/pki/ca.crt"
          ETCD_PEER_CLIENT_CERT_AUTH="true"

    - name: Create native etcd systemd unit file
      copy:
        dest: /etc/systemd/system/etcd.service
        content: |
          [Unit]
          Description=etcd key-value store
          Documentation=https://github.com/etcd-io/etcd
          After=network.target

          [Service]
          Type=notify
          EnvironmentFile=/etc/default/etcd
          ExecStart=/usr/bin/etcd
          Restart=always
          RestartSec=10s
          LimitNOFILE=40000

          [Install]
          WantedBy=multi-user.target
      notify: Reload systemd

  handlers:
    - name: Reload systemd
      command: systemctl daemon-reload

    - name: Flush handlers 
      meta: flush_handlers


- name: Setup for Master Nodes
  hosts: master
  become: yes
  tasks:
    - name: Wait to become available
      shell: cloud-init status --wait
      args:
        executable: /bin/bash

    - name: Pre pull images for kubeadm init
      command: kubeadm config images pull
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Write kubeadm config with external etcd
      copy:
        dest: /tmp/kubeadm-config.yaml
        content: |
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: ClusterConfiguration
          kubernetesVersion: v1.35.0
          controlPlaneEndpoint: "192.168.56.5:6443"
          networking:
            podSubnet: "10.244.0.0/16"
          etcd:
            external:
              endpoints:
                - https://192.168.56.11:2379
              caFile: /etc/kubernetes/pki/etcd/ca.crt
              certFile: /etc/kubernetes/pki/etcd/server.crt
              keyFile: /etc/kubernetes/pki/etcd/server.key
          ---
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: InitConfiguration
          localAPIEndpoint:
            advertiseAddress: "192.168.56.10"
            bindPort: 6443

    - name: Check if etcd certificates already exist
      stat:
        path: /etc/kubernetes/pki/etcd/apiserver-etcd-client.key
      register: etcd_certs_exist

    - name: Write etcd cert generation config
      copy:
        dest: /tmp/etcd-cert-config.yaml
        content: |
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: ClusterConfiguration
          etcd:
            local:
              serverCertSANs:
                - "192.168.56.11"
                - "etcd-db"
                - "127.0.0.1"
                - "localhost"
              peerCertSANs:
                - "192.168.56.11"
                - "etcd-db"
                - "127.0.0.1"
                - "localhost"

    - name: Generate etcd certs on master first
      shell: |
        kubeadm init phase certs etcd-ca
        kubeadm init phase certs etcd-server \
          --config=/tmp/etcd-cert-config.yaml
        kubeadm init phase certs etcd-peer \
          --config=/tmp/etcd-cert-config.yaml
        kubeadm init phase certs etcd-healthcheck-client \
          --config=/tmp/etcd-cert-config.yaml
        kubeadm init phase certs apiserver-etcd-client \
          --config=/tmp/etcd-cert-config.yaml
      when: not etcd_certs_exist.stat.exists

    - name: Ensure etcd group exists on db
      group:
        name: etcd
        state: present
      delegate_to: db

    - name: Ensure etcd user exists on db
      user:
        name: etcd
        group: etcd
        shell: /usr/sbin/nologin
        system: yes
        create_home: no
        state: present
      delegate_to: db

    - name: Create etcd config dir on db
      file:
        path: /etc/etcd
        state: directory
        mode: '0755'
        owner: root
        group: root
      delegate_to: db


    - name: Create etcd pki dir on db
      file:
        path: /etc/etcd/pki
        state: directory
        mode: '0750'
        owner: etcd
        group: etcd
      delegate_to: db

    - name: Fetch etcd certs from master to controller
      fetch:
        src: "/etc/kubernetes/pki/etcd/{{ item }}"
        dest: "/tmp/etcd-certs/{{ item }}"
        flat: yes
      loop:
        - ca.crt
        - ca.key
        - server.crt
        - server.key
        - peer.crt
        - peer.key

    - name: Push etcd certs to db node
      copy:
        src: "/tmp/etcd-certs/{{ item.file }}"
        dest: "/etc/etcd/pki/{{ item.file }}"
        mode: "{{ item.mode }}"
        owner: etcd
        group: etcd
      loop:
        - { file: 'ca.crt', mode: '0644' }
        - { file: 'ca.key', mode: '0600' }
        - { file: 'server.crt', mode: '0644' }
        - { file: 'server.key', mode: '0600' }
        - { file: 'peer.crt', mode: '0644' }
        - { file: 'peer.key', mode: '0600' }
      delegate_to: db

    - name: Check if cluster is already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: kubeadm_init_done

    - name: Stop etcd before reconfiguring
      systemd:
        name: etcd
        state: stopped
      delegate_to: db
      when: not kubeadm_init_done.stat.exists
      ignore_errors: yes

    - name: Clear stale etcd data directory
      file:
        path: /var/lib/etcd
        state: absent
      delegate_to: db
      when: not kubeadm_init_done.stat.exists

    - name: Recreate etcd data directory with correct ownership
      file:
        path: /var/lib/etcd
        state: directory
        owner: etcd
        group: etcd
        mode: '0700'
      delegate_to: db
      when: not kubeadm_init_done.stat.exists

    - name: Ensure etcd service is started on db node
      systemd:
        name: etcd
        state: started
        enabled: yes
      delegate_to: db

    - name: Wait db node to be ready for etcd
      wait_for:
        host: 192.168.56.11
        port: 2379
        timeout: 20
        delay: 5
      delegate_to: master


    - name: Cluster initialization with external etcd
      shell: kubeadm init --config=/tmp/kubeadm-config.yaml --upload-certs
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Create .kube directory for root
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: '0755'

    - name: Copy admin.conf to root kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes
        owner: root
        group: root
        mode: '0600'

    - name: Create .kube directory for vagrant
      ansible.builtin.file:
        path: /home/vagrant/.kube
        state: directory
        owner: vagrant
        group: vagrant
        mode: '0755'

    - name: Copy admin.conf to vagrant kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/vagrant/.kube/config
        remote_src: yes
        owner: vagrant
        group: vagrant
        mode: '0600'

- name: Setup after kube init 
  hosts: master
  become: yes
  tasks:
    - name: Install Calico CNI
      shell: |
        kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.29.0/manifests/calico.yaml
        kubectl set env daemonset/calico-node -n kube-system \
          IP_AUTODETECTION_METHOD=interface=eth1 \
          CALICO_IPV4POOL_CIDR=10.244.0.0/16 || true
      run_once: true

    - name: Create haproxy-system namespace
      shell: |
        kubectl create namespace haproxy-system --dry-run=client -o yaml | kubectl apply -f -
      run_once: true

    - name: Install HAProxy Ingress Controller
      shell: |
        helm repo add haproxy-ingress https://haproxy-ingress.github.io/charts
        helm repo update
        helm upgrade --install haproxy-ingress haproxy-ingress/haproxy-ingress \
          --namespace haproxy-system \
          --kubeconfig /etc/kubernetes/admin.conf
      run_once: true

  handlers:
    - name: Restart Containerd
      systemd:
        name: containerd
        state: restarted

- name: Setup for Master Node after CNI
  hosts: master 
  become: yes
  tasks:
    - name: Remove control-plane taint so pods can schedule on single node
      shell: |
        kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true 

    - name: Token for worker nodes to join the cluster
      command: kubeadm token create --print-join-command
      register: join_command
      run_once: true

    - name: Set join command fact for worker nodes
      set_fact:
        join_command: "{{ join_command.stdout }}"
      run_once: true

    - name: Install ArgoCD
      shell: |
        kubectl create namespace argocd || true
        kubectl apply -n argocd --server-side -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml 
      run_once: true

    - name: Wait for ArgoCD server to be ready
      shell: |
        kubectl wait --namespace argocd --for=condition=Ready pod -l app.kubernetes.io/name=argocd-server --timeout=600s
      run_once: true
      ignore_errors: yes

    - name: Install ArgoCD CLI
      get_url:
        url: https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-arm64
        dest: /usr/local/bin/argocd
        mode: '0755'
        force: no
      retries: 3
      delay: 5
      
    - name: Expose ArgoCD via NodePort
      shell: |
        kubectl patch svc argocd-server -n argocd \
          -p '{"spec": {"type": "NodePort"}}'

    - name: Get ArgoCD admin password
      shell: |
        kubectl -n argocd get secret argocd-initial-admin-secret \
          -o jsonpath="{.data.password}" | base64 -d
      register: argocd_admin_password

    - name: Display ArgoCD admin password
      debug:
        msg: "ArgoCD admin password: {{ argocd_admin_password.stdout }}"

    - name: Boostrap ArgoCD with a sample application
      shell: |
        kubectl apply -f https://raw.githubusercontent.com/Odasaku-Khan/DevOpsII/main/project/apps/app-of-apps.yaml
      run_once: true
    

- name: Setup for DB node
  hosts: db
  become: yes
  tasks:
    - name: Wait to become available
      shell: cloud-init status --wait
      args:
        executable: /bin/bash

    - name: Join db node to the cluster
      shell: "{{ hostvars['master']['join_command'] }}"
      args:
        creates: /etc/kubernetes/kubelet.conf

- name: Setup for Worker Nodes
  hosts: worker
  become: yes
  tasks:
    - name: Wait to become available
      shell: cloud-init status --wait
      args:
        executable: /bin/bash

    - name: Join worker nodes to the cluster
      shell: "{{ hostvars['master']['join_command'] }}"
      args:
        creates: /etc/kubernetes/kubelet.conf

- name: Setup applications from Master
  hosts: master
  become: yes
  tasks:
    - name: Wait for db and worker to be ready
      shell: kubectl wait --for=condition=Ready nodes --all --timeout=300s

    - name: Label db node for storage workloads
      shell: kubectl label node db node-role=storage --overwrite

    - name: Label worker node
      shell: kubectl label node worker node-role=worker --overwrite

    - name: Install Longhorn from official manifest
      shell: |
        kubectl apply -f https://raw.githubusercontent.com/longhorn/longhorn/v1.11.1/deploy/longhorn.yaml
      args:
        creates: /tmp/longhorn-installed
      register: longhorn_apply

    - name: Mark Longhorn as installed
      file:
        path: /tmp/longhorn-installed
        state: touch


    - name: Install full observability stack (Prometheus + Loki + Grafana)
      shell: |
        helm repo add grafana https://grafana.github.io/helm-charts
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo update

        helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
          --namespace monitoring --create-namespace \
          --set prometheus.prometheusSpec.nodeSelector."node-role"=worker \
          --set grafana.enabled=false \
          --set alertmanager.enabled=false

        helm upgrade --install loki grafana/loki-stack \
          --namespace monitoring \
          --set grafana.enabled=true \
          --set grafana.nodeSelector."node-role"=worker \
          --set promtail.enabled=true \
          --set loki.persistence.enabled=true \
          --set loki.persistence.storageClassName=longhorn \
          --set loki.persistence.size=5Gi \
          --set grafana.sidecar.datasources.enabled=true \
          --set grafana.additionalDataSources[0].name=Prometheus \
          --set grafana.additionalDataSources[0].type=prometheus \
          --set grafana.additionalDataSources[0].url=http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090 \
          --set grafana.additionalDataSources[0].access=proxy \
          --set grafana.sidecar.dashboards.enabled=true \
          --set grafana.sidecar.dashboards.label=grafana_dashboard
      run_once: true