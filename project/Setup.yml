
- name: Setup Load Balancer
  hosts: lb
  become: yes
  tasks:
    - name: Wait to become available
      shell: cloud-init status --wait
      args:
        executable: /bin/bash

    - name: Install HAProxy and Keepalived
      apt:
        name:
          - haproxy
          - keepalived
          - curl
        state: present
        update_cache: yes

    - name: Configure HAProxy for Kubernetes API load balancing
      copy:
        dest: /etc/haproxy/haproxy.cfg
        content: |
          global
              maxconn 4096
              log /dev/log local0
              log /dev/log local1 notice
              chroot /var/lib/haproxy
              stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
              stats timeout 30s
              user haproxy
              group haproxy
              ssl-default-bind-ciphers TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
              ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11
              daemon
          defaults
              log global
              mode tcp
              option tcplog
              option dontlognull
              timeout connect 10s
              timeout client 1m
              timeout server 1m
          frontend kubernetes-api
              bind *:6443
              default_backend kubernetes-api-backend
          backend kubernetes-api-backend
              balance roundrobin
              option tcp-check
              server master  192.168.56.10:6443 check
              server master1 192.168.56.11:6443 check
              server master2 192.168.56.12:6443 check
      notify: Restart HAProxy

    - name: Ensure HAProxy is started and enabled
      systemd:
        name: haproxy
        state: started
        enabled: yes

    - name: Configure Keepalived for VIP management
      copy:
        dest: /etc/keepalived/keepalived.conf
        content: |
          vrrp_instance VI_1 {
              state MASTER
              interface eth1
              virtual_router_id 51
              priority 100
              advert_int 1
              authentication {
                  auth_type PASS
                  auth_pass 42
              }
              virtual_ipaddress {
                  192.168.56.5
              }
          }
      notify: Restart Keepalived

    - name: Ensure Keepalived is started and enabled
      systemd:
        name: keepalived
        state: started
        enabled: yes

  handlers:
    - name: Restart HAProxy
      systemd:
        name: haproxy
        state: restarted
    - name: Restart Keepalived
      systemd:
        name: keepalived
        state: restarted

- name: Setup pre Kubernetes 
  hosts: all
  become: yes
  tasks:
    - name: Wait to become available
      shell: cloud-init status --wait
      args:
        executable: /bin/bash

    - name: Disable swap
      command: swapoff -a
      ignore_errors: yes

    - name: Comment out swap in /etc/fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*swap.*)$'
        replace: '#\\1'

    - name: Replace http to https
      replace:
        path: /etc/apt/sources.list
        regexp: 'http://ports.ubuntu.com'
        replace: 'https://ports.ubuntu.com'

    - name: Load brnetfilter for iptables
      modprobe:
        name: br_netfilter
        state: present

    - name: Set sysctl parameters for Kubernetes networking
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-ip6tables = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward = 1
      notify: Reload sysctl


    - name: Ensure br_netfilter is loaded on boot
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          br_netfilter

    - name: Ensure sysctl parameters are applied
      command: sysctl --system

    - name: Force Google DNS for Kubernetes
      copy:
        dest: /etc/resolv.conf
        content: |
          nameserver 8.8.8.8
          nameserver 8.8.4.4

    - name: Load necessary additional tools 
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - open-iscsi
          - findmnt
          - blkid
          - lsblk 
        state: present
        update_cache: yes

    - name: Enable and start iscsid service
      systemd:
        name: iscsid
        state: started
        enabled: yes

    - name: Install Containerd
      apt:
        name: containerd
        state: present
        update_cache: yes

    - name: Dir for configure Containerd
      ansible.builtin.file :
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Move default config for Containerd
      ansible.builtin.command: "containerd config default > /etc/containerd/config.toml"
      args:
        creates: /etc/containerd/config.toml

    - name: Set SystemdCgroup to true in Containerd config
      lineinfile:
        path: /etc/containerd/config.toml
        regexp: '^(\s*)SystemdCgroup\s*=\s*false'
        line: '\1SystemdCgroup = true'
        backrefs: yes

    - name: Make keyrings directory 
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Kubernetes GPG key 
      shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.35/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes apt repository
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.35/deb/ /'

    - name: Update apt cache after adding Kubernetes repo
      apt:
        update_cache: yes

    - name: Install Helm
      shell: |
        curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        chmod +x get_helm.sh
        ./get_helm.sh
      args:
        creates: /usr/local/bin/helm
      
    - name: Install Kubernetes components
      apt:
        name:
          - kubelet
          - kubectl
        state: present
        update_cache: yes

    - name: Hold kubeadm, kubelet, kubectl at current version
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [kubeadm, kubelet, kubectl]

    - name: Install Calico CNI
      shell: |
        kubectl apply -f https://docs.projectcalico.org/manifests/calico.yaml
        kubectl set env daemonset/calico-node -n kube-system \
          IP_AUTODETECTION_METHOD=interface=eth1 \
          CALICO_IPV4POOL_CIDR=10.244.0.0/16 || true
      run_once: true

    - name: Wait for all nodes to be ready
      shell: |
        kubectl wait --for=condition=Ready nodes --all --timeout=300s
      ignore_errors: yes

    - name: Install HAProxy Ingress Controller
      shell: |
        helm repo add haproxy-ingress https://haproxy-ingress.github.io/charts
        helm repo update
        helm install haproxy-ingress haproxy-ingress/haproxy-ingress --namespace haproxy-system --create-namespace
      run_once: true

  handlers:
    - name: Reload sysctl
      command: sysctl --system

    - name: Restart Containerd
      systemd:
        name: containerd
        state: restarted

- name: Setup for Master Nodes
  hosts: master
  become: yes
  tasks:
    - name: Wait to become available
      shell: cloud-init status --wait
      args:
        executable: /bin/bash

    - name: Install kubeadm
      apt:
        name: kubeadm
        state: present
        update_cache: yes

    - name: Pre pull images for kubeadm init
      command: kubeadm config images pull
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Cluster initialization with kubeadm
      command: kubeadm init --pod-network-cidr=10.244.0.0/16 --apiserver-advertise-address=192.168.56.10
      args:
        creates: /etc/kubernetes/admin.conf
      run_once: true

    - name: Create .kube directory for root
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: '0755'

    - name: Copy admin.conf to root kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes
        owner: root
        group: root
        mode: '0600'

    - name: Create .kube directory for vagrant
      ansible.builtin.file:
        path: /home/vagrant/.kube
        state: directory
        owner: vagrant
        group: vagrant
        mode: '0755'

    - name: Copy admin.conf to vagrant kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/vagrant/.kube/config
        remote_src: yes
        owner: vagrant
        group: vagrant
        mode: '0600'


    - name: Remove control-plane taint so pods can schedule on single node
      shell: |
        kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true 

    - name: Token for worker nodes to join the cluster
      command: kubeadm token create --print-join-command
      register: join_command
      run_once: true

    - name: Set join command fact for worker nodes
      set_fact:
        join_command: "{{ join_command.stdout }}"
      run_once: true

    - name: Install ArgoCD
      shell: |
        kubectl create namespace argocd || true
        kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      run_once: true

    - name: Wait for ArgoCD server to be ready
      shell: |
        kubectl wait --namespace argocd --for=condition=Ready pod -l app.kubernetes.io/name=argocd-server --timeout=300s
      run_once: true

    - name: Install ArgoCD CLI
      shell: |
        curl -sSL -o /usr/local/bin/argocd

    - name: Expose ArgoCD via NodePort
      shell: |
        kubectl patch svc argocd-server -n argocd \
          -p '{"spec": {"type": "NodePort"}}'

    - name: Get ArgoCD admin password
      shell: |
        kubectl -n argocd get secret argocd-initial-admin-secret \
          -o jsonpath="{.data.password}" | base64 -d
      register: argocd_admin_password

    - name: Display ArgoCD admin password
      debug:
        msg: "ArgoCD admin password: {{ argocd_admin_password.stdout }}"

    - name: Boostrap ArgoCD with a sample application
      shell: |
        kubectl apply -f https://raw.githubusercontent.com/Odasaku-Khan/DevOpsII/main/project/apps/app-of-apps.yaml
      run_once: true
    

- name: Setup for DB node
  hosts: db
  become: yes
  tasks:
    - name: Wait to become available
      shell: cloud-init status --wait
      args:
        executable: /bin/bash

    - name: Join db node to the cluster
      shell: "{{ hostvars['master']['join_command'] }}"
      args:
        creates: /etc/kubernetes/kubelet.conf

    - name: Install by helm my PostgreSQL
      shell: |
        helm repo add Odasaku-Khan https://Odasaku-khan.github.io/DevOpsII/project/helm-charts/postgresql.yaml
        helm repo update
        helm install my-postgresql Odasaku-Khan/postgresql 

    - name: Install Longhorn
      shell: |
        helm repo add longhorn https://charts.longhorn.io
        helm repo update
        helm install longhorn longhorn/longhorn --namespace longhorn-system --create-namespace

    - name: Wait for Longhorn to be ready
      shell: |
        kubectl wait --namespace longhorn-system --for=condition=Ready pod -l app.kubernetes.io/name=longhorn-manager --timeout=300s
      run_once: true

    - name: Display Longhorn UI access information
      debug:
        msg: "Longhorn UI is available at http://<NodeIP>:<NodePort> (check the NodePort with 'kubectl get svc -n longhorn-system')"

- name: Setup for Worker Nodes
  hosts: worker
  become: yes
  tasks:
    - name: Wait to become available
      shell: cloud-init status --wait
      args:
        executable: /bin/bash

    - name: Join worker nodes to the cluster
      shell: "{{ hostvars['master']['join_command'] }}"
      args:
        creates: /etc/kubernetes/kubelet.conf

    - name: Install Keycloak from Helm
      shell: |
        helm repo add Odasaku-Khan https://Odasaku-khan.github.io/DevOpsII/project/helm-charts/keycloak.yaml
        helm repo update
        helm install my-keycloak Odasaku-Khan/keycloak

    - name: Wait for Keycloak to be ready
      shell: |
        kubectl wait --for=condition=Ready pod -l app.kubernetes.io/name=my
      run_once: true

    - name: Install Prometheus and Grafana using kube-prometheus-stack
      shell: |
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo update
        helm install monitoring prometheus-community/kube-prometheus-stack --namespace monitoring --create-namespace
      run_once: true

    - name: Wait for Prometheus and Grafana to be ready
      shell: |
        kubectl wait --namespace monitoring --for=condition=Ready pod -l app.kubernetes
          .io/name=prometheus-server --timeout=300s
        kubectl wait --namespace monitoring --for=condition=Ready pod -l app.kubernetes
          .io/name=grafana --timeout=300s
      run_once: true

    - name: Display Prometheus and Grafana access information
      debug:
        msg: |
          Prometheus is available at http://<NodeIP>:<NodePort> 
          Grafana is available at http://<NodeIP>:<NodePort>

    





