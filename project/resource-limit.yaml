apiVersion: v1
kind: LimitRange
metadata:
  name: limitrange
  namespace: demo
spec:
  limits:
    - type: Container
      default:        { cpu: 200m,  memory: 128Mi }
      defaultRequest: { cpu: 50m,   memory: 64Mi  }
      max:            { cpu: 500m,  memory: 512Mi }
      min:            { cpu: 10m,   memory: 16Mi  }
    - type: Pod
      max:            { cpu: "1",   memory: 1Gi   }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: demo
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 512Mi
    limits.cpu: "2"
    limits.memory: 1Gi
    pods: "20"
    services: "10"
    secrets: "20"
    configmaps: "20"
    services.loadbalancers: "0"

---
